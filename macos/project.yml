name: KobeanREST
options:
  bundleIdPrefix: com.kobeanrest
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  KobeanREST:
    type: application
    platform: macOS
    sources:
      - path: KobeanREST
      - path: Generated/kobean_ffi.swift
    settings:
      base:
        PRODUCT_NAME: KobeanREST
        PRODUCT_BUNDLE_IDENTIFIER: com.kobeanrest.app
        INFOPLIST_FILE: KobeanREST/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: KobeanREST/Resources/KobeanREST.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - framework: Frameworks/KobeanFFI.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: AuthenticationServices.framework
      - sdk: JavaScriptCore.framework
      - sdk: SystemConfiguration.framework

  KobeanRESTTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KobeanRESTTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kobeanrest.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KobeanREST.app/Contents/MacOS/KobeanREST"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: KobeanREST
