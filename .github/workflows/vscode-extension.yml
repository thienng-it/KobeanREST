name: VS Code Extension CI

on:
  push:
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension.yml'
    branches: [main]
  pull_request:
    paths:
      - 'vscode-extension/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to VS Code Marketplace'
        type: boolean
        default: false

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Type check
        working-directory: vscode-extension
        run: npm run lint

      - name: Build extension
        working-directory: vscode-extension
        run: npm run build:prod

      - name: Run contract tests
        run: node --test tests/vscode-extension-contract.test.mjs

      - name: Package VSIX
        working-directory: vscode-extension
        run: npx @vscode/vsce package --no-dependencies -o kobeanrest.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobeanrest-vsix
          path: vscode-extension/kobeanrest.vsix
          retention-days: 30

  publish:
    name: Publish to Marketplace
    needs: build-and-test
    if: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/ext-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Build extension (production)
        working-directory: vscode-extension
        run: npm run build:prod

      - name: Publish to VS Code Marketplace
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: npx @vscode/vsce publish --no-dependencies

      - name: Publish to Open VSX Registry
        working-directory: vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: npx ovsx publish --no-dependencies
        continue-on-error: true
