name: Daily E2E QA Automation & Email Report

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-e2e-automation:
    name: Run CodeceptJS E2E Automation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit & contract tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Run CodeceptJS E2E Test Suite
        run: npm run test:e2e || true

      - name: Upload E2E Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeceptjs-e2e-report
          path: tests/e2e/output/
          if-no-files-found: ignore

      - name: Send QA Test Results via Email to Contributors
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER_ADDRESS || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_SERVER_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[QA Report] KobeanREST CodeceptJS E2E Automation Results (${{ job.status }})"
          to: ${{ secrets.NOTIFICATION_EMAILS || 'thienng-it@users.noreply.github.com,kobenguyent@users.noreply.github.com' }}
          from: KobeanREST QA Automation Bot <qa-bot@kobeanrest.com>
          html_body: |
            <h2>⚡ KobeanREST Daily QA Automation Report</h2>
            <p><strong>Status:</strong> ${{ job.status }}</p>
            <p><strong>Framework:</strong> CodeceptJS + Playwright (Headless Chromium)</p>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Commit:</strong> <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            <p><strong>Action Run Details:</strong> <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Automation Run Artifacts</a></p>
            <hr />
            <p><i>Automated report generated by Senior SDET QA Automation Pipeline for KobeanREST contributors.</i></p>
          ignore_cert: true
          priority: high
