name: Daily E2E QA Automation

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-e2e-automation:
    name: Run CodeceptJS E2E Automation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm i

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Run unit & contract tests
        id: test
        continue-on-error: true
        run: npm test 2>&1 | tee test-output.log

      - name: Build web application
        id: build
        run: npm run build

      - name: Run E2E GUI Tests
        id: e2e
        continue-on-error: true
        run: npm run test:e2e 2>&1 | tee e2e-output.log

      - name: Record Daily Test Metrics to QA History
        if: always()
        env:
          TEST_STEP_OUTCOME: ${{ steps.test.outcome }}
          BUILD_STEP_OUTCOME: ${{ steps.build.outcome }}
          E2E_STEP_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          node scripts/record-qa-run.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs-site/public/qa-history.json
          git commit -m "chore(qa): record daily automated test metrics to history database [skip ci]" || echo "No QA history changes to commit"
          git push origin main || echo "No changes to push"

      - name: Upload E2E Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeceptjs-e2e-report
          path: tests/e2e/output/
          if-no-files-found: ignore

      - name: Generate Detailed QA Test Summary Report
        if: always()
        shell: bash
        run: |
          cat qa-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Send QA Test Results via Email to Contributors
        if: always() && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != ''
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER_ADDRESS || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_SERVER_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[QA Report] KobeanREST CodeceptJS E2E Automation Results (${{ job.status }})"
          to: ${{ secrets.NOTIFICATION_EMAILS || 'thienng-it@users.noreply.github.com,kobenguyent@users.noreply.github.com' }}
          from: KobeanREST QA Automation Bot <qa-bot@kobeanrest.com>
          html_body: |
            <h2>⚡ KobeanREST Daily QA Automation Report</h2>
            <p><strong>Status:</strong> ${{ job.status }}</p>
            <p><strong>Framework:</strong> CodeceptJS + Playwright (Headless Chromium)</p>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Commit:</strong> <a href="https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            <p><strong>Action Run Details:</strong> <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Automation Run Artifacts</a></p>
            <hr />
            <p><i>Automated report generated by Senior SDET QA Automation Pipeline for KobeanREST contributors.</i></p>
          ignore_cert: true
          priority: high

      - name: Fail workflow if tests failed
        if: always() && (steps.test.outcome != 'success' || steps.e2e.outcome != 'success' || steps.build.outcome != 'success')
        run: |
          echo "QA pipeline detected failures in test, build, or e2e steps."
          exit 1
