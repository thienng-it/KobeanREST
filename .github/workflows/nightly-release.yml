name: Nightly Auto-Release & Version Bump Bot

on:
  schedule:
    - cron: "0 0 * * *" # Runs every night at 00:00 UTC
  workflow_dispatch:
    inputs:
      bump_type:
        description: "SemVer bump type override (auto detects from conventional commits)"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "patch"
          - "minor"
          - "major"
      force_release:
        description: "Force release build even if no new qualifying commits are detected"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry run mode (analyze commits and changelog without writing tags or triggering builds)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-and-bump:
    name: Scan Commits & Evaluate Auto-Bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.scanner.outputs.should_release }}
      tag_name: ${{ steps.scanner.outputs.tag_name }}
      release_name: ${{ steps.scanner.outputs.release_name }}
      is_prerelease: ${{ steps.scanner.outputs.is_prerelease }}
      bump_type: ${{ steps.scanner.outputs.bump_type }}
      release_notes: ${{ steps.scanner.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm i

      - name: Run release preflight contract checks
        run: npm run check:release

      - name: Run intelligent commit & release scanner
        id: scanner
        shell: bash
        run: |
          node scripts/release-scanner.mjs --bump \
            --bump-type=${{ inputs.bump_type || 'auto' }} \
            ${{ inputs.force_release == true && '--force' || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Commit version bump and push git tag
        if: steps.scanner.outputs.should_release == 'true' && inputs.dry_run != true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_TAG="${{ steps.scanner.outputs.tag_name }}"
          NEXT_VER="${{ steps.scanner.outputs.next_version }}"

          echo "Committing version bump to ${NEXT_VER} and tagging ${TARGET_TAG}..."

          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml CHANGELOG.md
          git commit -m "chore(release): auto-bump version to ${NEXT_VER} [skip ci]" || echo "No file modifications to commit"
          git push origin main

          git tag "${TARGET_TAG}"
          git push origin "${TARGET_TAG}"

  build-and-deploy:
    name: Build & Deploy ${{ matrix.platform.name }}
    needs: check-and-bump
    if: needs.check-and-bump.outputs.should_release == 'true' && inputs.dry_run != true
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
            bundle_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz.sig
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/dmg/*.dmg.sig
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
              src-tauri/target/release/bundle/macos/*.tar.gz
              src-tauri/target/release/bundle/macos/*.tar.gz.sig
          - name: Windows
            os: windows-latest
            args: ""
            bundle_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
              src-tauri/target/release/bundle/msi/*.zip
              src-tauri/target/release/bundle/msi/*.zip.sig
              src-tauri/target/release/bundle/nsis/*.zip
              src-tauri/target/release/bundle/nsis/*.zip.sig
          - name: Linux
            os: ubuntu-latest
            args: ""
            bundle_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools file wget

      - name: Install libsodium (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libsodium:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "SODIUM_USE_PKG_CONFIG=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm i

      - name: Run contract tests
        run: npm test

      - name: Build desktop installers & upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CLI_APPIMAGE_APPRUN_URL: https://cdn.jsdelivr.net/gh/tauri-apps/binary-releases@apprun-old/AppRun-x86_64
        with:
          tagName: ${{ needs.check-and-bump.outputs.tag_name }}
          releaseName: ${{ needs.check-and-bump.outputs.release_name }}
          releaseBody: ${{ needs.check-and-bump.outputs.release_notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.platform.args }}

      - name: Upload platform bundle files
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform.name }}
          path: ${{ matrix.platform.bundle_paths }}
          if-no-files-found: warn

  checksums-and-manifest:
    name: Generate Checksums & Publish Manifest
    needs: [check-and-bump, build-and-deploy]
    if: needs.check-and-bump.outputs.should_release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download platform bundle files
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-artifacts
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -exec rm -rf {} +
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Publish SHA256SUMS.txt to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.check-and-bump.outputs.tag_name }}" release-artifacts/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"

      - name: Build merged updater manifest (latest.json)
        run: node scripts/build-updater-manifest.mjs release-artifacts "${{ needs.check-and-bump.outputs.tag_name }}" "${{ github.repository }}"

      - name: Publish latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.check-and-bump.outputs.tag_name }}" release-artifacts/latest.json --clobber --repo "${{ github.repository }}"

      - name: Publish release (Undraft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.check-and-bump.outputs.tag_name }}" --draft=false --repo "${{ github.repository }}"
