name: Nightly Auto-Release & Version Bump Bot

on:
  schedule:
    - cron: "0 0 * * *" # Runs every night at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-bump:
    name: Check Commits & Auto-Bump Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      release_name: ${{ steps.check.outputs.release_name }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check commits and auto-bump version
        id: check
        shell: bash
        run: |
          # Configure Git Bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PKG_VERSION=$(node -p "require('./package.json').version")
          VERSION_TAG="v${PKG_VERSION}"

          echo "Current package version: ${PKG_VERSION}"

          # Check if current version tag exists on remote
          if ! git rev-parse "${VERSION_TAG}" >/dev/null 2>&1; then
            echo "Version tag ${VERSION_TAG} does not exist on remote. Tagging and building ${VERSION_TAG}."
            git tag "${VERSION_TAG}"
            git push origin "${VERSION_TAG}"

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
            echo "release_name=KobeanREST ${VERSION_TAG}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if there are new commits on main since the last version tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "${VERSION_TAG}")
          COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count 2>/dev/null || echo "0")

          echo "Commits since ${LATEST_TAG}: ${COMMITS_SINCE}"

          if [ "$COMMITS_SINCE" -eq 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No new commits found on main since ${LATEST_TAG}. Skipping nightly auto-bump."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auto-bump patch version (e.g. 0.1.3 -> 0.1.4)
          NEXT_VERSION=$(node -p "
            const parts = require('./package.json').version.split('.');
            parts[2] = Number(parts[2]) + 1;
            parts.join('.');
          ")
          NEW_TAG="v${NEXT_VERSION}"

          echo "Bumping version to ${NEXT_VERSION} (tag: ${NEW_TAG})"

          # 1. Update package.json & package-lock.json
          npm version ${NEXT_VERSION} --no-git-tag-version

          # 2. Update tauri.conf.json
          node -e "
            const fs = require('fs');
            const file = 'src-tauri/tauri.conf.json';
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = '${NEXT_VERSION}';
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          "

          # 3. Update Cargo.toml
          node -e "
            const fs = require('fs');
            const file = 'src-tauri/Cargo.toml';
            let content = fs.readFileSync(file, 'utf8');
            content = content.replace(/^version = \"[^\"]+\"/m, 'version = \"${NEXT_VERSION}\"');
            fs.writeFileSync(file, content);
          "

          # Commit version bump to main
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore(release): auto-bump version to ${NEXT_VERSION} [skip ci]"
          git push origin main

          # Create and push tag
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=KobeanREST ${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=false" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Build & Deploy ${{ matrix.platform.name }}
    needs: check-and-bump
    if: needs.check-and-bump.outputs.should_release == 'true'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
            bundle_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig
          - name: Windows
            os: windows-latest
            args: ""
            bundle_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
          - name: Linux
            os: ubuntu-latest
            args: ""
            bundle_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install libsodium (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libsodium:x64-windows-static-md
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "SODIUM_USE_PKG_CONFIG=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm test

      - name: Build desktop installers & upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check-and-bump.outputs.tag_name }}
          releaseName: ${{ needs.check-and-bump.outputs.release_name }}
          releaseBody: "Automated KobeanREST release build. Includes cross-platform desktop installers and signed update metadata."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.platform.args }}

      - name: Upload platform bundle files
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform.name }}
          path: ${{ matrix.platform.bundle_paths }}
          if-no-files-found: warn

  checksums-and-manifest:
    name: Generate Checksums & Publish Manifest
    needs: [check-and-bump, build-and-deploy]
    if: needs.check-and-bump.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Download platform bundle files
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Publish SHA256SUMS.txt to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.check-and-bump.outputs.tag_name }}" release-artifacts/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"

      - name: Build merged updater manifest (latest.json)
        run: node scripts/build-updater-manifest.mjs release-artifacts "${{ needs.check-and-bump.outputs.tag_name }}" "${{ github.repository }}"

      - name: Publish latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.check-and-bump.outputs.tag_name }}" release-artifacts/latest.json --clobber --repo "${{ github.repository }}"
