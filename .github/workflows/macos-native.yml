name: macos-native

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "macos/**"
      - "package.json"
      - ".github/workflows/macos-native.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "macos/**"
      - "package.json"
      - ".github/workflows/macos-native.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-and-swift:
    name: Native macOS Core, FFI & SwiftUI Build/Test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Test Rust core & UniFFI crates
        run: |
          cargo test -p kobean-core
          cargo test -p kobean-ffi

      - name: Build universal Rust XCFramework & Swift bindings
        run: ./macos/scripts/build-rust-xcframework.sh --universal

      - name: Generate Xcode project
        run: |
          cd macos
          xcodegen generate

      - name: Build & test native macOS app
        run: |
          xcodebuild test \
            -project macos/KobeanREST.xcodeproj \
            -scheme KobeanREST \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive Release app (universal macOS binary)
        run: |
          xcodebuild build \
            -project macos/KobeanREST.xcodeproj \
            -scheme KobeanREST \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath macos/DerivedData \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Apple Developer ID certificate (optional)
        if: github.event_name != 'pull_request' && vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/kobean-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dev_id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Package Native macOS DMG & ZIP artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          APPLE_DEVELOPER_IDENTITY: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && secrets.APPLE_DEVELOPER_IDENTITY || '' }}
        run: ./macos/scripts/package-macos-native.sh --skip-build

      - name: Notarize & staple DMG + generate Sparkle appcast (optional)
        if: github.event_name != 'pull_request' && vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          codesign --force --timestamp --sign "$APPLE_DEVELOPER_IDENTITY" macos/build/KobeanREST-macOS-Native.dmg
          API_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_NOTARY_API_KEY_P8" > "$API_KEY_FILE"
          xcrun notarytool submit macos/build/KobeanREST-macOS-Native.dmg \
            --key "$API_KEY_FILE" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple macos/build/KobeanREST-macOS-Native.dmg
          cp macos/build/KobeanREST-macOS-Native.dmg "macos/build/KobeanREST-${{ steps.meta.outputs.version }}-macOS-Native.dmg"
          test -n "$SPARKLE_EDDSA_KEY"
          brew install --cask sparkle
          SPARKLE_BIN="$(brew --prefix)/Caskroom/sparkle/$(brew list --cask --versions sparkle | awk '{print $2}')/bin/generate_appcast"
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle_eddsa.key"
          printf '%s' "$SPARKLE_EDDSA_KEY" > "$SPARKLE_KEY_FILE"
          chmod 600 "$SPARKLE_KEY_FILE"
          mkdir -p macos/build/sparkle
          cp macos/build/KobeanREST-macOS-Native.dmg macos/build/sparkle/
          "$SPARKLE_BIN" --ed-key-file "$SPARKLE_KEY_FILE" macos/build/sparkle/

      - name: Cleanup temporary signing files
        if: always() && github.event_name != 'pull_request' && vars.MACOS_SIGNING_ENABLED == 'true'
        run: |
          rm -f "$RUNNER_TEMP/dev_id.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle_eddsa.key"
          security delete-keychain "$RUNNER_TEMP/kobean-signing.keychain-db" >/dev/null 2>&1 || true

      - name: Upload Native macOS DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KobeanREST-macOS-Native-dmg
          path: |
            macos/build/KobeanREST-macOS-Native.dmg
            macos/build/KobeanREST-*-macOS-Native.dmg
            macos/build/sparkle/appcast.xml
          if-no-files-found: error

      - name: Upload Native macOS ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KobeanREST-macOS-Native-zip
          path: |
            macos/build/KobeanREST-macOS-Native.zip
            macos/build/KobeanREST-*-macOS-Native.zip
          if-no-files-found: error

      - name: Publish Native macOS artifacts to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --title "KobeanREST $TAG" --notes "KobeanREST $TAG release." --draft --repo "${{ github.repository }}"
          fi
          gh release upload "$TAG" \
            macos/build/KobeanREST-macOS-Native.dmg \
            "macos/build/KobeanREST-${{ steps.meta.outputs.version }}-macOS-Native.dmg" \
            macos/build/KobeanREST-macOS-Native.zip \
            "macos/build/KobeanREST-${{ steps.meta.outputs.version }}-macOS-Native.zip" \
            --clobber --repo "${{ github.repository }}"

      - name: Publish installation summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 🍎 KobeanREST Native macOS App (SwiftUI + AppKit)

          Download the native macOS build directly from the **Artifacts** section of this workflow run or from **GitHub Releases**:
          - **`KobeanREST-macOS-Native.dmg`** — Disk image containing `KobeanREST.app` + one-click `Install KobeanREST (No Apple Dev Account).command`
          - **`KobeanREST-macOS-Native.zip`** — Compressed `KobeanREST.app` bundle

          ### Installing on macOS (No Apple Developer Account Required)
          1. **Option A (DMG One-Click Installer):** Open `KobeanREST-macOS-Native.dmg` and double-click **`Install KobeanREST (No Apple Dev Account).command`**.
          2. **Option B (Terminal one-liner after dragging to `/Applications`):**
             ```bash
             xattr -cr /Applications/KobeanREST.app && open /Applications/KobeanREST.app
             ```
          EOF
