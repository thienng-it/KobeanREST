[package]
name = "kobean-core"
version = "0.2.0"
edition = "2021"
authors = ["Nguyen Thai Minh Thien (Joseph)"]
license = "MIT"
description = "Platform-independent core library for KobeanREST."

[dependencies]
base64 = "0.22"
form_urlencoded = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
